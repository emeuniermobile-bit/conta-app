# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen`
name: Contamination
options:
  bundleIdPrefix: fr.contamination
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  Contamination:
    type: application
    platform: iOS
    sources:
      - Contamination
    dependencies:
      - package: Supabase
    entitlements:
      path: Contamination/Contamination.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Contamination/Info.plist
      properties:
        CFBundleDisplayName: Contamination
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [location, remote-notification]
        NSLocationWhenInUseUsageDescription: >-
          Contamination utilise ta position approximative pour savoir si tu croises des zombies dans Paris.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Avec « Toujours », le virus te suit même appli fermée : tes rencontres dans le métro ou dans la rue
          comptent sans que tu aies à ouvrir l'appli. Ta position est arrondie à 50 m et effacée après 6 h.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
